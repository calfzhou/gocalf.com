baseURL = 'https://gocalf.com/'
title = 'GoCalf'
theme = 'sidera'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
timeZone = 'Asia/Shanghai'
disableKinds = ['RSS']
# Keep editor configuration, templates and support files out of content output.
ignoreFiles = ['(^|/)(\.[^/]+|_templates|_utils|__pycache__)(/|$)', '(^|/)consistency-report\.md$', '\.edtz$', '\.py[co]$']
# Preserve site content and explicitly mount the theme-owned user manual.
[[module.mounts]]
source = 'content'
target = 'content'
[[module.mounts]]
source = 'themes/sidera/docs/content'
target = 'content/sidera'

[taxonomies]
_merge = 'shallow'
[permalinks.term]
_merge = 'shallow'
[permalinks.page]
oldblog = '/oldblog/:slug/'
blog = '/blog/:year/:month/:day/:slug/'
[frontmatter]
date = ['date', 'publishDate', 'pubdate', 'published']
publishDate = ['publishDate', 'pubdate', 'published', 'date']
lastmod = ['lastmod', 'modified', 'publishDate', 'pubdate', 'published', 'date']
[pagination]
path = 'page'
disableAliases = true
[markup.tableOfContents]
_merge = 'shallow'
[markup.goldmark.parser]
_merge = 'deep'
[markup.goldmark.extensions.passthrough]
_merge = 'deep'
[params.giscus]
repo = 'calfzhou/gocalf.com'
repo_id = 'R_kgDOLtX9yA'
category = 'Announcements'
category_id = 'DIC_kwDOLtX9yM4Ce98o'
strict = false
reactions = true
input_position = 'top'

[params]
description = '1/100 ALGO&MATH; 1/100 IT&GAME; 1/100 INFO&SHARING; 1/100 WHO KNOWS'
color_mode = 'dark'
# Comments use this site's verified repository and pathname-equivalent identity.
comments = true
# Site-owned welcome service; no raw HTML in Markdown is required.
jinrishici = true
link_heading_checks = true
taxonomy_hierarchy = ['tags']
right = ['toc']
license = '本文由 [Calf](/) 原创，采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
share = ['link', 'wechat', 'email']
# Optional source-edit URL; leave empty to omit edit links.
edit_url = ''
footer_menu = 'footer'
footer_text = '''本站所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

Copyright © 2011-2026 [gocalf.com](/) 保留所有权利。'''
[params.identity]
image = '/images/gocalf-circle.svg'
subtitle = 'Calf 的自留地 · 昙花一现 | 或有月下赏花人 应无所憾'

