# P4-B private migration scaffold, not deployment configuration.
# Current scope/remaining avatar/content decisions: migration-project/P4-B.md.
baseURL = 'https://gocalf.com/'
title = 'GoCalf'
theme = 'sidera'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
timeZone = 'Asia/Shanghai'
disableKinds = ['RSS']
# Preserve Python editor/import geometry without publishing support code.
ignoreFiles = ['(^|/)_utils(/|$)']
[taxonomies]
_merge = 'shallow'
[permalinks.term]
_merge = 'shallow'
[permalinks.page]
blog = '/blog/:year/:month/:day/:slug/'
[frontmatter]
date = ['date', 'publishDate', 'pubdate', 'published']
publishDate = ['publishDate', 'pubdate', 'published', 'date']
lastmod = ['lastmod', 'modified', 'publishDate', 'pubdate', 'published', 'date']
[pagination]
path = 'page'
disableAliases = true
[markup.tableOfContents]
_merge = 'shallow'
[markup.goldmark.parser]
_merge = 'deep'
[markup.goldmark.extensions.passthrough]
_merge = 'deep'
[params]
description = '1/100 ALGO&MATH; 1/100 IT&GAME; 1/100 INFO&SHARING; 1/100 WHO KNOWS'
color_mode = 'dark'
# Explicitly unconfigured/off: production category/node IDs have not been verified.
comments = false
link_heading_checks = true
taxonomy_hierarchy = ['tags']
right = ['toc']
license = '本文由 [Calf](/) 原创，采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
share = ['link', 'wechat', 'email']
# Do not invent unpushed main/content edit URLs. Final display policy awaits review.
edit_url = ''
footer_menu = 'footer'
footer_text = '''本站所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

Copyright © 2011-2024 [gocalf.com](/) 保留所有权利。'''
[params.identity]
image = '/images/calf.png'
subtitle = 'Calf 的自留地 · 昙花一现 | 或有月下赏花人 应无所憾'

