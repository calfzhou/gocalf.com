name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this main-branch build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUGO_VERSION: '0.166.0'
      HUGO_SHA256: '0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Hugo extended
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 --max-time 120 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$HUGO_SHA256" "$archive_path" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build production site
        run: |
          export HUGO_CACHEDIR="$RUNNER_TEMP/hugo-cache"
          hugo version
          make build
      - name: Check artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat public/CNAME)" = gocalf.com
          test -s public/404.html
          if find public \( -name .obsidian -o -name _templates -o -name _utils \
            -o -name __pycache__ -o -name .trash -o -name consistency-report.md \
            -o -name .editorconfig -o -name .gitignore -o -name '*.edtz' \
            -o -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo 'Editor or support files found in output' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Successful main pushes publish automatically. PRs never deploy.
    # Manual main runs publish only when deploy is explicitly enabled.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
